<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亦诺 AI OS · 店铺管理</title><style>*{box-sizing:border-box}body{font:14px system-ui,"Microsoft YaHei",sans-serif;color:#17243d;background:#f2f5fa;margin:0}main{max-width:1320px;margin:auto;padding:26px}h1{font-size:27px;margin:0 0 7px}h2{font-size:19px}a{color:#355aaa}.card{background:#fff;border:1px solid #e0e8f2;border-radius:14px;padding:21px;margin:16px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e1e7f1;padding:14px;border-radius:12px}.stat strong{display:block;font-size:25px;margin-top:5px}button{border:0;border-radius:8px;background:#15233c;color:white;padding:11px 16px;cursor:pointer;font:inherit}button.secondary{background:#e8edf5;color:#17243d}input,select{padding:10px;border:1px solid #ccd7e6;border-radius:9px;font:inherit;min-width:125px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field select{width:100%}.notice{background:#ecf4ff;border-radius:9px;padding:13px;line-height:1.65}.muted{color:#697990}.error{color:#b42334}.ok{color:#07815e}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ebf3}th{background:#f5f7fc} .scroll{overflow:auto;max-height:550px}@media(max-width:800px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><div class="row" style="justify-content:space-between"><div><h1>亦诺 · TEMU 店铺管理</h1><div class="muted">正式店铺目录 / 广告来源别名 / 负责人及团队信息</div></div><a href="/temu-ads-ai-os.html">返回数据分析 AI OS</a> <a href="/temu-pairing.html">商品身份配对</a></div><div id="login" class="card"><h2>管理员登录</h2><div class="row"><input id="email" type="email" placeholder="公司邮箱"><input id="password" type="password" placeholder="密码"><button id="loginBtn">登录</button></div><div id="loginMsg" class="error"></div></div><div id="app" class="hidden"><div class="notice">这页使用现有 Supabase 正式店铺目录，非另建重复档案。新增店铺不会自动授予员工权限；修改基础资料保留历史操作。删除、停用和店铺合并暂不开放，以保护已有订单及商品映射。</div><div id="stats" class="statgrid" style="margin-top:16px"></div><div class="grid"><section class="card"><h2>新增店铺</h2><div class="field"><label>店铺名称</label><input id="newName" placeholder="例如 香港6号"></div><div class="field"><label>经营模式</label><select id="newModel"><option value="">待确定</option><option value="半托管">半托管</option><option value="全托管">全托管</option><option value="其他">其他</option></select></div><div class="field"><label>负责人</label><input id="newOwner" placeholder="负责人姓名（可不填）"></div><div class="field"><label>运营团队</label><input id="newTeam" placeholder="团队名称（可不填）"></div><button id="createStore">创建正式店铺</button><p id="createMsg"></p></section><section class="card"><h2>管理店铺基本资料</h2><div class="field"><label>选择店铺</label><select id="editStore"></select></div><div class="field"><label>经营模式</label><select id="editModel"><option value="">待确定</option><option value="半托管">半托管</option><option value="全托管">全托管</option><option value="其他">其他</option></select></div><div class="field"><label>负责人</label><input id="editOwner"></div><div class="field"><label>运营团队</label><input id="editTeam"></div><button id="saveStore">保存修改</button><p id="editMsg"></p></section></div><section class="card"><h2>广告报表店铺名称配对</h2><div class="notice">对未匹配的原始店铺名称选择正式店铺后，历史广告数据将自动归入该店铺。若原名已绑定其他店铺，更改时要求确认及详细说明。</div><div class="row"><label>原始名称 <select id="rawName"></select></label><label>对应正式店铺 <select id="aliasTarget"></select></label><input id="reason" placeholder="更改绑定的原因"><label><input id="confirm" type="checkbox" style="min-width:auto">确认更改</label><button id="bindAlias">确认店铺配对</button><button id="refresh" class="secondary">刷新</button></div><p id="aliasMsg"></p><div id="aliasTable" class="scroll"></div></section><section class="card"><h2>正式店铺列表</h2><div class="row"><input id="search" placeholder="搜索店铺名/负责人/团队"><span id="count" class="muted"></span></div><div id="storeTable" class="scroll"></div></section></div></main>
<script>
const BASE='https://iscadepgzegrvcqzosso.supabase.co',KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2',API=BASE+'/functions/v1/temu-ads-v1';let token=localStorage.getItem('temu_token')||'',data=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,t,bad=false){$(id).textContent=t;$(id).className=bad?'error':'ok'}
async function api(route,body){const r=await fetch(API+'?api='+route,{method:body?'POST':'GET',headers:{apikey:KEY,authorization:'Bearer '+token,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function table(head,rows){return '<table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function option(id,label){return '<option value="'+esc(id)+'">'+esc(label)+'</option>'}
function editChanged(){const s=data.stores.find(x=>x.id===$('editStore').value);if(!s)return;$('editOwner').value=s.owner_name||'';$('editTeam').value=s.team_name||'';$('editModel').value=s.business_model||'';}
function aliasChanged(){const a=data.aliases.find(x=>x.raw_store_name===$('rawName').value);$('aliasTarget').value=a?.store_id||''}
function render(){
 const stores=data.stores,names=[...new Set(data.source_names.map(x=>x.name))].sort(),linked=new Set(data.aliases.map(a=>a.raw_store_name));
 const counts=[['正式店铺',stores.length],['来源店铺',names.length],['已关联来源',names.filter(n=>linked.has(n)).length],['待匹配来源',names.filter(n=>!linked.has(n)).length]];
 $('stats').innerHTML=counts.map(([k,v])=>'<div class="stat"><span class="muted">'+esc(k)+'</span><strong>'+v+'</strong></div>').join('');
 const eOld=$('editStore').value,nOld=$('rawName').value;
 $('editStore').innerHTML=stores.map(s=>option(s.id,s.store_name));if(stores.some(s=>s.id===eOld))$('editStore').value=eOld;
 $('aliasTarget').innerHTML=option('','请选择正式店铺')+stores.filter(s=>s.is_active).map(s=>option(s.id,s.store_name)).join('');
 $('rawName').innerHTML=names.map(n=>option(n,n));if(names.includes(nOld))$('rawName').value=nOld;
 editChanged();aliasChanged();
 $('aliasTable').innerHTML=table(['报表原始店铺','正式店铺','匹配方式','SPU数量'],names.map(n=>{const a=data.aliases.find(x=>x.raw_store_name===n),s=stores.find(x=>x.id===a?.store_id),count=data.source_names.find(x=>x.name===n);return[n,s?.store_name||'待匹配',a?.match_status||'未匹配',count?.spus??0]}));
 renderStoreList();
}
function renderStoreList(){const q=$('search').value.trim().toLowerCase(),rows=data.stores.filter(s=>[s.store_name,s.owner_name,s.team_name].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent='共 '+rows.length+' 条';$('storeTable').innerHTML=table(['店铺名称','平台','经营模式','负责人','团队','启用状态'],rows.map(s=>[s.store_name,s.platform,s.business_model||'待确定',s.owner_name||'—',s.team_name||'—',s.is_active?'启用':'停用']))}
async function load(){data=await api('store-management');$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}
$('loginBtn').onclick=async()=>{try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'登录失败');token=j.access_token;localStorage.setItem('temu_token',token);await load()}catch(e){msg('loginMsg',e.message,true)}};
$('editStore').onchange=editChanged;$('rawName').onchange=aliasChanged;$('search').oninput=renderStoreList;
$('createStore').onclick=async()=>{try{const name=$('newName').value.trim();if(!confirm('确认在正式公司店铺目录新增「'+name+'」？新店铺不会自动分配员工权限。'))return;await api('store-save',{action:'create',store_name:name,business_model:$('newModel').value,owner_name:$('newOwner').value,team_name:$('newTeam').value});msg('createMsg','正式店铺已新增');await load()}catch(e){msg('createMsg',e.message,true)}};
$('saveStore').onclick=async()=>{try{await api('store-save',{action:'edit',store_id:$('editStore').value,business_model:$('editModel').value,owner_name:$('editOwner').value,team_name:$('editTeam').value});msg('editMsg','店铺信息保存成功');await load()}catch(e){msg('editMsg',e.message,true)}};
$('bindAlias').onclick=async()=>{try{const old=data.aliases.find(a=>a.raw_store_name===$('rawName').value),diff=!!old&&old.store_id!==$('aliasTarget').value;if(diff&&!confirm('即将重新关联此店铺历史广告数据，确认真实对应关系？'))return;await api('store-save',{action:'alias',raw_store_name:$('rawName').value,store_id:$('aliasTarget').value,reason:$('reason').value,confirm:$('confirm').checked});msg('aliasMsg','店铺名称配对已保存');await load()}catch(e){msg('aliasMsg',e.message,true)}};
$('refresh').onclick=()=>load().catch(e=>msg('aliasMsg',e.message,true));
if(token)load().catch(e=>msg('loginMsg',e.message,true));
</script></body></html>
