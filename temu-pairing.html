<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亦诺 商品身份配对中心</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1a263a;font:14px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1300px;margin:auto;padding:24px}h1{font-size:26px}h2{font-size:18px;margin:0 0 15px}.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}input,select{padding:10px;border:1px solid #cfdae7;border-radius:9px;min-width:150px}button{background:#14243e;border:0;border-radius:9px;color:white;padding:11px 15px;cursor:pointer}.muted{color:#718096}.notice{background:#edf5ff;padding:14px;border-radius:9px;line-height:1.7}.bad{color:#aa3d2a}.good{color:#047857}.hide{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e6ebf3;padding:10px;text-align:left}th{background:#f5f7fa}.scroll{max-height:420px;overflow:auto}a{color:#3357a1}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="row" style="justify-content:space-between"><div><h1>亦诺 · 商品身份配对中心</h1><p class="muted">店铺名称 → SPU → 公司统一款式编号 · 独立测试 V1</p></div><a href="/temu-ads-ai-os.html">← 返回广告 AI OS</a></div>
<div id="login" class="card"><h2>公司账号登录</h2><div class="row"><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button id="loginBtn">登录</button></div><p id="loginError" class="bad"></p></div>
<div id="app" class="hide"><div class="card"><div class="notice">系统从已上传日报列出真实店铺/SPU。点击保存会默认审核通过并同步正式商品身份库；同款式不重复写入。覆盖不同的正式款式时，仍需勾选确认并填写至少8字原因。店铺不存在时先记录待建档。</div><div class="row"><label>原始店铺：<select id="rawStore"></select></label><label>商品搜索：<input id="search" placeholder="SPU/商品标题"></label><button id="refresh">刷新</button></div><div id="stats" class="muted"></div></div>
<div class="grid"><div class="card"><h2>① 店铺名称配对</h2><p id="storeCurrent" class="muted"></p><div class="row"><select id="canonical"></select><button id="saveStore">确认配对</button></div><p class="muted">未在正式目录中的店铺：</p><div class="row"><input id="pendingName" placeholder="新店铺名称（待建档）"><button id="savePending">记录待建档</button></div></div>
<div class="card"><h2>② SPU 对应统一款式编号</h2><div class="row"><label>商品 SPU：<select id="spu"></select></label></div><p id="styleCurrent" class="notice"></p><div class="row"><input id="styleCode" list="styleOptions" placeholder="选择/输入公司款式编号"><datalist id="styleOptions"></datalist><button id="saveStyle">保存并绑定成功</button></div></div></div>
<div class="card"><h2>重要修改确认</h2><div class="row"><input id="reason" style="min-width:360px" placeholder="覆盖旧关系需注明原因（至少8字）"><label><input id="confirm" type="checkbox" style="min-width:auto"> 我已核对并确认覆盖测试层关系</label></div><p id="message"></p></div>
<div class="card"><h2>③ 当前店铺的 SPU</h2><div id="products" class="scroll"></div></div><div class="card"><h2>④ 最近操作审计</h2><div id="audit" class="scroll"></div></div></div></main>
<script>
const BASE='https://iscadepgzegrvcqzosso.supabase.co', KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2', API=BASE+'/functions/v1/temu-ads-v1';let token=localStorage.getItem('temu_token')||'',ctx=null;
const e=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
async function call(path,opts={}){const r=await fetch(API+'?api='+path,{...opts,headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+token}});const x=await r.json();if(!r.ok)throw Error(x.error||'请求失败');return x}
function table(cols,rows){return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function msg(t,bad=false){e('message').className=bad?'bad':'good';e('message').textContent=t}
function alias(){return ctx.aliases.find(a=>a.raw_store_name===e('rawStore').value)}
function selectedPair(){const name=e('rawStore').value,spu=e('spu').value,store=alias();const p=ctx.pairings.find(x=>x.raw_store_name===name&&x.spu===spu);const m=store&&ctx.legacy.find(x=>x.store_id===store.store_id&&x.spu===spu);const st=m&&ctx.styles.find(x=>x.id===m.style_id);return {p,official:st?.style_code||null}}
function selected(){const name=e('rawStore').value, a=alias(),pend=ctx.pending.find(x=>x.raw_store_name===name);e('canonical').value=a?.store_id||'';e('storeCurrent').textContent=a?'当前关联：'+ctx.stores.find(s=>s.id===a.store_id)?.store_name+'（'+a.match_status+'）':pend?'待建档：'+pend.proposed_store_name:'当前未关联';e('pendingName').value=pend?.proposed_store_name||'';
const search=e('search').value.toLowerCase(),all=ctx.products.filter(x=>x.raw_store_name===name&&(x.spu.includes(search)||(x.product_title||'').toLowerCase().includes(search)));
const old=e('spu').value;e('spu').innerHTML=all.map(x=>'<option value="'+esc(x.spu)+'">'+esc(x.spu)+'</option>').join('');if(all.some(x=>x.spu===old))e('spu').value=old;
e('products').innerHTML=table(['SPU','商品标题','测试配对','正式配对'],all.map(x=>{const p=ctx.pairings.find(t=>t.raw_store_name===name&&t.spu===x.spu);const m=a&&ctx.legacy.find(t=>t.store_id===a.store_id&&t.spu===x.spu);const s=m&&ctx.styles.find(t=>t.id===m.style_id);return [x.spu,(x.product_title||'').slice(0,100),p?.style_code||'—',s?.style_code||'—']}));showStyle()}
function showStyle(){const p=selectedPair();e('styleCurrent').textContent='当前配对：'+(p.p?.style_code||'暂无')+'；正式商品身份库：'+(p.official||'暂无');e('styleCode').value=p.p?.style_code||p.official||''}
function render(){const names=[...new Set(ctx.products.map(x=>x.raw_store_name))].sort(),prev=e('rawStore').value;e('rawStore').innerHTML=names.map(x=>'<option>'+esc(x)+'</option>').join('');if(names.includes(prev))e('rawStore').value=prev;
e('canonical').innerHTML='<option value="">选择正式店铺</option>'+ctx.stores.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.store_name)+'</option>').join('');
e('styleOptions').innerHTML=ctx.styles.map(s=>'<option value="'+esc(s.style_code)+'"></option>').join('');
e('stats').textContent='日报来源店铺 '+names.length+' 个 · 公司款式主表 '+ctx.styles.length+' 个 · AI OS测试配对 '+ctx.pairings.length+' 条';
e('audit').innerHTML=table(['时间','对象','动作','关联键','原因'],ctx.audit.map(a=>[a.created_at?.slice(0,19),a.entity_type,a.action,a.entity_key,a.reason||'—']));
selected()}
async function reload(){ctx=await call('pairing-context');e('login').classList.add('hide');e('app').classList.remove('hide');render()}
e('loginBtn').onclick=async()=>{try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e('email').value,password:e('password').value})});const x=await r.json();if(!r.ok)throw Error(x.error_description||x.msg||'登录失败');token=x.access_token;localStorage.setItem('temu_token',token);await reload()}catch(x){e('loginError').textContent=x.message}};
e('rawStore').onchange=selected;e('search').oninput=selected;e('spu').onchange=showStyle;e('refresh').onclick=()=>reload().catch(x=>msg(x.message,true));
async function save(body){msg('正在保存');const out=await call('pairing-save',{method:'POST',body:JSON.stringify(body)});await reload();msg(out.no_change?'正式库已有相同配对，无需重复写入':(body.action==='style'?'已自动审核通过，正式商品身份库绑定成功':'保存成功，已记录操作审计'))}
e('saveStore').onclick=async()=>{try{if(!e('canonical').value)throw Error('请先选择正式店铺');await save({action:'store',raw_store_name:e('rawStore').value,store_id:e('canonical').value,reason:e('reason').value,confirm:e('confirm').checked})}catch(x){msg(x.message,true)}};
e('savePending').onclick=async()=>{try{await save({action:'pending_store',raw_store_name:e('rawStore').value,proposed_store_name:e('pendingName').value,reason:e('reason').value})}catch(x){msg(x.message,true)}};
e('saveStyle').onclick=async()=>{try{if(!e('spu').value||!e('styleCode').value.trim())throw Error('请先选SPU并填款式编号');await save({action:'style',raw_store_name:e('rawStore').value,spu:e('spu').value,style_code:e('styleCode').value.trim(),reason:e('reason').value,confirm:e('confirm').checked})}catch(x){msg(x.message,true)}};
if(token)reload().catch(x=>{e('loginError').textContent=x.message});
</script></body></html>
