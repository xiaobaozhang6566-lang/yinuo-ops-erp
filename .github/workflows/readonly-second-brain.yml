name: AI Second Brain Readonly Release
on:
  push:
    branches:
      - release/ai-second-brain-readonly-v1
  workflow_dispatch:
jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check v13.js && node --check v14.js && node --check second-brain-readonly.js
      - run: node tests/version-observer-login-regression.cjs
      - run: node tests/second-brain-readonly.test.cjs

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/read-only-server.log 2>&1 &
      - run: node tests/second-brain-browser-e2e.cjs
