name: AI Knowledge Safety Checks
on:
  push:
    branches:
      - feature/ai-second-brain-v1
  workflow_dispatch:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run knowledge contract tests
        run: node tests/knowledge-contract.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check knowledge.js
          node --check v13.js
          node --check v14.js
