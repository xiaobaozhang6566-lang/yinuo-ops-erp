name: AI Knowledge Safety Checks
on:
  push:
    branches:
      - feature/ai-second-brain-v1
  workflow_dispatch:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run knowledge contract tests
        run: |
          node tests/knowledge-contract.test.cjs
          node tests/p0-review-contract.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check knowledge.js
          node --check v13.js
          node --check v14.js

  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: kb_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load disposable fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/p0_local_fixture.sql
      - name: Install candidate review RPC
        run: psql -X -v ON_ERROR_STOP=1 -f sql/kb_review_with_reason_TEST_ONLY.sql
      - name: Run transaction and authorization cases
        run: psql -X -v ON_ERROR_STOP=1 -f tests/p0_local_cases.sql
