<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>亦诺跨境 · TEMU 商品智能运营测试</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;box-shadow:0 8px 28px rgba(25,40,65,.06)}.box{width:min(430px,100%);padding:28px}.box h1{margin:0 0 8px;font-size:25px}.muted{color:#718096;font-size:14px}.form{display:grid;gap:10px;margin-top:18px}input,button{font:inherit;padding:12px;border-radius:10px}input{border:1px solid #d7dde8}button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer}.app{max-width:1200px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.card{padding:18px}.kpi{font-size:30px;font-weight:750;margin-top:5px}.pill{background:#eaf0ff;color:#3452a4;padding:6px 10px;border-radius:999px;font-size:13px}.section{margin-top:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}.warning{color:#c27a00}.critical{color:#bd2020}.hide{display:none}.notice{padding:10px 12px;background:#eef6ff;border:1px solid #cfe4ff;border-radius:10px;color:#34527a;font-size:13px;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.app{padding:16px}}
  </style>
</head>
<body>
<main id="login" class="login">
  <section class="box">
    <h1>亦诺跨境 · TEMU 商品智能运营</h1>
    <div class="muted">独立测试版 P0-3</div>
    <div class="notice">使用现有运营任务 ERP 的公司账号登录。测试通过后再合并进正式 ERP。</div>
    <form id="f" class="form">
      <input id="e" type="email" placeholder="邮箱" required />
      <input id="p" type="password" placeholder="密码" required />
      <button type="submit">登录</button>
    </form>
    <p id="err" class="critical"></p>
  </section>
</main>
<main id="app" class="app hide">
  <div class="top">
    <div>
      <h1 style="margin:0">TEMU US 商品智能运营</h1>
      <div class="muted">P0-3 · 数据 → 诊断 → 动作 → 实验 → 验证</div>
    </div>
    <div><span id="role" class="pill"></span> <button id="out" style="background:#e9edf4;color:#172033">退出</button></div>
  </div>
  <div class="grid">
    <div class="card"><div class="muted">已纳管商品</div><div id="pc" class="kpi">0</div></div>
    <div class="card"><div class="muted">AI诊断</div><div id="dc" class="kpi">0</div></div>
    <div class="card"><div class="muted">高优先级</div><div id="hc" class="kpi">0</div></div>
    <div class="card"><div class="muted">可访问店铺</div><div id="sc" class="kpi">0</div></div>
  </div>
  <section class="card section">
    <h2>AI诊断 / 当前优先级</h2>
    <div id="tbl"></div>
  </section>
</main>
<script>
const SUPABASE_URL='https://iscadepgzegrvcqzosso.supabase.co';
const KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2';
const API=SUPABASE_URL+'/functions/v1/temu-ops?api=dashboard';
let tok=localStorage.getItem('temu_token')||'';
const q=id=>document.getElementById(id);
async function login(email,password){
  const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error_description||d.msg||'登录失败');
  tok=d.access_token; localStorage.setItem('temu_token',tok);
}
async function refresh(){
  const r=await fetch(API,{headers:{authorization:'Bearer '+tok,'apikey':KEY}});
  if(r.status===401){logout();return}
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'读取失败');
  q('role').textContent=d.member?.role==='manager'?'Manager':'Operator';
  q('pc').textContent=d.product_count||0; q('dc').textContent=(d.diagnostics||[]).length;
  q('hc').textContent=(d.diagnostics||[]).filter(x=>Number(x.action_priority)>=80).length; q('sc').textContent=(d.stores||[]).length;
  const ds=d.diagnostics||[];
  q('tbl').innerHTML=ds.length?'<div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>商品</th><th>诊断</th><th>等级</th><th>置信度</th><th>Priority</th><th>机会损失</th><th>建议</th></tr></thead><tbody>'+ds.map(x=>'<tr><td>'+x.business_date+'</td><td>'+x.product_id+'</td><td>'+x.diagnosis_type+'</td><td class="'+(x.severity==='CRITICAL'?'critical':x.severity==='WARNING'?'warning':'')+'">'+x.severity+'</td><td>'+(x.confidence_band||'-')+'</td><td>'+(x.action_priority??'-')+'</td><td>'+Number(x.opportunity_loss_orders||0).toFixed(1)+'单</td><td>'+(x.recommended_action||'-')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">暂无可用诊断。数据上传与每日自动扫描后会显示在这里。</p>';
  q('login').classList.add('hide'); q('app').classList.remove('hide');
}
function logout(){tok='';localStorage.removeItem('temu_token');q('app').classList.add('hide');q('login').classList.remove('hide')}
q('f').onsubmit=async ev=>{ev.preventDefault();q('err').textContent='';try{await login(q('e').value,q('p').value);await refresh()}catch(x){q('err').textContent=x.message}};
q('out').onclick=logout; if(tok)refresh().catch(()=>logout());
</script>
</body>
</html>
