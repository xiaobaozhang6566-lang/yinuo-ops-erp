<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亦诺跨境运营任务 ERP</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f5f7fb;color:#172033}*{box-sizing:border-box}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:28px}.logo{font-size:20px;font-weight:800;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.input{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.blue{background:#2563eb;color:#fff}.gray{background:#eef2f7}.red{background:#fff0f0;color:#b91c1c}.full{width:100%}.muted{color:#778298}.msg{padding:10px;background:#fff1f2;color:#be123c;border-radius:8px;margin-top:12px}.app{min-height:100vh}.top{background:#10182a;color:#fff;padding:0 24px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:transparent;color:#b9c3d3;border:0;padding:9px 12px;border-radius:7px}.nav .on{background:#26344f;color:#fff}.wrap{padding:22px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid #e4e8ef;border-radius:12px}.card{padding:16px}.num{font-size:28px;font-weight:800;margin-top:7px}.panel{margin-bottom:16px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #e8ebf1;display:flex;align-items:center;justify-content:space-between}.head h3{margin:0}.body{padding:16px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.table th{font-size:12px;color:#6b7280;background:#f8fafc}.pill{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f5f9}.urgent{background:#fff1f2;color:#be123c}.important{background:#fff7ed;color:#c2410c}.done{background:#ecfdf5;color:#047857}.doing{background:#eff6ff;color:#1d4ed8}.over{color:#dc2626;font-weight:700}.member{padding:11px 0;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;align-items:center}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.top{padding:14px}.wrap{padding:12px}.member{grid-template-columns:1fr}.nav{width:100%}}</style></head><body><div id="root"></div><script>
const U='https://iscadepgzegrvcqzosso.supabase.co',K='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2',S={session:null,user:null,member:null,members:[],stores:[],tasks:[],page:'home'};const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hs(auth=1){let h={apikey:K,'Content-Type':'application/json'};if(auth&&S.session?.access_token)h.Authorization='Bearer '+S.session.access_token;return h}function ss(x){S.session=x;x?localStorage.setItem('ynerp',JSON.stringify(x)):localStorage.removeItem('ynerp')}
async function api(p,o={}){let r=await fetch(U+p,{...o,headers:{...hs(o.auth!==0),...(o.headers||{})}}),t=await r.text(),d=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;if(!r.ok)throw Error(d?.message||d?.error_description||d?.hint||'请求失败');return d}
async function login(email,password){let d=await api('/auth/v1/token?grant_type=password',{method:'POST',auth:0,body:JSON.stringify({email,password})});ss(d);S.user=d.user;boot()}async function signup(name,email,password){let d=await api('/auth/v1/signup',{method:'POST',auth:0,body:JSON.stringify({email,password,data:{display_name:name}})});if(d.access_token){ss(d);S.user=d.user;boot()}else auth('login','注册成功，请完成邮箱确认，然后登录。')}
function auth(mode='login',ok=''){root.innerHTML=`<div class="login"><div class="box"><div class="logo">YN · 亦诺跨境 ERP</div><h2>${mode==='login'?'登录运营任务系统':'创建员工账号'}</h2><p class="muted">${mode==='login'?'运营任务 V1':'首个账号自动成为管理员；后续账号需管理员启用。'}</p><form id="af">${mode==='signup'?'<div class="field"><label>姓名</label><input class="input" name="name" required></div>':''}<div class="field"><label>邮箱</label><input class="input" type="email" name="email" required></div><div class="field"><label>密码</label><input class="input" type="password" name="password" minlength="6" required></div><button class="btn blue full">${mode==='login'?'登录':'注册'}</button><div id="am">${ok?`<p class="muted">${e(ok)}</p>`:''}</div></form><p class="muted" style="text-align:center">${mode==='login'?'<a id="sw">注册账号</a>':'<a id="sw">返回登录</a>'}</p></div></div>`;af.onsubmit=async x=>{x.preventDefault();let f=new FormData(af);try{mode==='login'?await login(f.get('email'),f.get('password')):await signup(f.get('name'),f.get('email'),f.get('password'))}catch(z){am.innerHTML=`<div class="msg">${e(z.message)}</div>`}};sw.onclick=()=>auth(mode==='login'?'signup':'login')}
async function boot(){if(!S.session){try{S.session=JSON.parse(localStorage.getItem('ynerp'))}catch{}}if(!S.session)return auth();let uid=S.session.user?.id||S.user?.id;if(!uid){try{uid=JSON.parse(atob(S.session.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch{return auth()}}try{let m=await api('/rest/v1/ops_members?select=*&user_id=eq.'+uid);S.member=m[0];if(!S.member)return auth('login','账号未初始化，请重新登录');if(S.member.role==='pending'||!S.member.is_active)return pending();await load();draw()}catch(z){ss(null);auth('login','登录已失效，请重新登录')}}
async function load(){[S.stores,S.tasks]=await Promise.all([api('/rest/v1/stores?select=id,store_name&is_active=eq.true&order=store_name'),api('/rest/v1/ops_tasks?select=*&order=created_at.desc')]);S.members=S.member.role==='manager'?await api('/rest/v1/rpc/ops_list_members',{method:'POST',body:'{}'}):[S.member]}
function pending(){root.innerHTML=`<div class="login"><div class="box"><h2>账号等待启用</h2><p class="muted">${e(S.member.display_name)}，管理员启用后即可使用。</p><button class="btn gray" onclick="boot()">刷新</button> <button class="btn red" onclick="out()">退出</button></div></div>`}async function out(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}ss(null);S.member=null;auth()}
function draw(){let manager=S.member.role==='manager',nav=[['home','首页'],['mine','我的任务'],...(manager?[['tasks','任务管理'],['team','团队任务']]:[])];root.innerHTML=`<div class="app"><div class="top"><b>YN · 运营任务 ERP</b><div class="nav">${nav.map(n=>`<button data-p="${n[0]}" class="${S.page===n[0]?'on':''}">${n[1]}</button>`).join('')}</div><div>${e(S.member.display_name)} · ${manager?'管理员':'运营'} <button class="btn gray" onclick="out()">退出</button></div></div><div class="wrap" id="c"></div></div>`;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;draw()});page()}
const sn=id=>S.stores.find(x=>x.id===id)?.store_name||'—',fmt=x=>x?new Date(x).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'—',over=t=>t.status!=='已完成'&&t.due_at&&new Date(t.due_at)<new Date();
function tab(ts,ass=1,del=0){if(!ts.length)return '<div class="body muted">暂无任务</div>';return `<div class="scroll"><table class="table"><tr>${ass?'<th>负责人</th>':''}<th>店铺</th><th>任务</th><th>类型</th><th>优先级</th><th>截止</th><th>状态</th><th>结果</th><th>操作</th></tr>${ts.map(t=>`<tr>${ass?`<td><b>${e(t.assignee)}</b></td>`:''}<td>${e(sn(t.store_id))}</td><td>${e(t.title)}${t.spu?`<br><small class="muted">SPU ${e(t.spu)}</small>`:''}</td><td>${e(t.task_type)}</td><td><span class="pill ${t.priority==='紧急'?'urgent':t.priority==='重要'?'important':''}">${e(t.priority)}</span></td><td class="${over(t)?'over':''}">${fmt(t.due_at)}${over(t)?' 超期':''}</td><td><span class="pill ${t.status==='已完成'?'done':t.status==='处理中'?'doing':''}">${e(t.status)}</span></td><td>${e(t.result||'—')}</td><td><button class="btn gray" onclick="editTask('${t.id}')">处理</button>${del?` <button class="btn red" onclick="dropTask('${t.id}')">删</button>`:''}</td></tr>`).join('')}</table></div>`}
function page(){let manager=S.member.role==='manager';if(S.page==='home'){let d=new Date().toLocaleDateString('sv-SE'),ts=S.tasks.filter(t=>t.task_date===d&&(manager||t.assignee_user_id===S.member.user_id)),done=ts.filter(t=>t.status==='已完成').length,od=S.tasks.filter(t=>over(t)&&(manager||t.assignee_user_id===S.member.user_id)).length;c.innerHTML=`<div class="cards"><div class="card">今日任务<div class="num">${ts.length}</div></div><div class="card">待完成<div class="num">${ts.length-done}</div></div><div class="card">已完成<div class="num">${done}</div></div><div class="card">超期<div class="num ${od?'over':''}">${od}</div></div></div><div class="panel"><div class="head"><h3>今日任务</h3>${manager?'<button class="btn blue" onclick="createTask()">+ 新建任务</button>':''}</div>${tab(ts,manager,manager)}</div>`}else if(S.page==='mine'){c.innerHTML=`<div class="panel"><div class="head"><h3>我的任务</h3></div>${tab(S.tasks.filter(t=>t.assignee_user_id===S.member.user_id),0)}</div>`}else if(S.page==='tasks'&&manager){c.innerHTML=`<div class="panel"><div class="head"><h3>全部任务</h3><button class="btn blue" onclick="createTask()">+ 新建任务</button></div>${tab(S.tasks,1,1)}</div>`}else if(S.page==='team'&&manager){let pend=S.members.filter(m=>m.role==='pending'),act=S.members.filter(m=>m.role!=='pending');c.innerHTML=`${pend.length?`<div class="panel"><div class="head"><h3>待启用账号</h3></div><div class="body">${pend.map(m=>`<div class="member"><b>${e(m.display_name)}</b><span class="muted">${e(m.email)}</span><button class="btn blue" onclick="approve('${m.user_id}')">启用为运营</button></div>`).join('')}</div></div>`:''}<div class="panel"><div class="head"><h3>团队概览</h3></div><div class="body">${act.map(m=>{let ts=S.tasks.filter(t=>t.assignee_user_id===m.user_id),dn=ts.filter(t=>t.status==='已完成').length;return `<div class="member"><b>${e(m.display_name)}</b><span>任务 ${ts.length} · 已完成 ${dn}</span><span class="muted">${m.role==='manager'?'管理员':'运营'}</span></div>`}).join('')}</div></div>`}else{S.page='home';draw()}}
async function createTask(){let a=S.members.filter(m=>m.role!=='pending'&&m.is_active),who=prompt('负责人：\n'+a.map((m,i)=>`${i+1}. ${m.display_name}`).join('\n'),'1');if(!who)return;let m=a[Number(who)-1];if(!m)return alert('负责人选择无效');let title=prompt('任务内容');if(!title)return;let type=prompt('任务类型：广告检查 / 商品检查 / 售后检查 / 新品跟进 / 其他任务','商品检查')||'其他任务',priority=prompt('优先级：普通 / 重要 / 紧急','普通')||'普通';try{await api('/rest/v1/rpc/ops_create_task',{method:'POST',body:JSON.stringify({p_assignee_user_id:m.user_id,p_store_id:null,p_spu:'',p_task_type:type,p_title:title,p_priority:priority,p_due_at:null})});await load();draw()}catch(z){alert(z.message)}}
async function editTask(id){let t=S.tasks.find(x=>x.id===id),status=prompt('状态：待处理 / 处理中 / 已完成',t.status);if(!status)return;let result=prompt('处理结果',t.result||'')??'';try{await api('/rest/v1/rpc/ops_update_my_task',{method:'POST',body:JSON.stringify({p_id:id,p_status:status,p_result:result})});await load();draw()}catch(z){alert(z.message)}}async function dropTask(id){if(!confirm('确认删除？'))return;await api('/rest/v1/rpc/ops_delete_task',{method:'POST',body:JSON.stringify({p_id:id})});await load();draw()}async function approve(id){await api('/rest/v1/rpc/ops_set_member_access',{method:'POST',body:JSON.stringify({p_user_id:id,p_role:'employee',p_is_active:true})});await load();draw()}
try{S.session=JSON.parse(localStorage.getItem('ynerp'))}catch{}boot();
</script></body></html>
