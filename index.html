<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>亦诺跨境运营任务 ERP</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#778298;--line:#e4e8ef;--blue:#2563eb;--blue2:#eff6ff;--red:#be123c;--green:#047857;--orange:#c2410c}
    *{box-sizing:border-box}body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
    .login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}.logo{font-size:20px;font-weight:800;margin-bottom:24px}
    .field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.input{width:100%;padding:11px;border:1px solid #d7dce5;border-radius:8px;background:#fff;color:var(--text)}textarea.input{min-height:110px;resize:vertical}
    .btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.blue{background:var(--blue);color:#fff}.gray{background:#eef2f7;color:var(--text)}.red{background:#fff0f0;color:#b91c1c}.full{width:100%}
    .muted{color:var(--muted)}.msg{padding:10px;background:#fff1f2;color:var(--red);border-radius:8px;margin-top:12px}.app{min-height:100vh}
    .top{background:#10182a;color:#fff;padding:0 24px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:transparent;color:#b9c3d3;border:0;padding:9px 12px;border-radius:7px;cursor:pointer}.nav .on{background:#26344f;color:#fff}
    .wrap{padding:22px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:16px}.num{font-size:28px;font-weight:800;margin-top:7px}.panel{margin-bottom:16px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #e8ebf1;display:flex;align-items:center;justify-content:space-between}.head h3{margin:0}.body{padding:16px}.scroll{overflow:auto}
    .table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.table th{font-size:12px;color:#6b7280;background:#f8fafc}.pill{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f5f9}.urgent{background:#fff1f2;color:var(--red)}.important{background:#fff7ed;color:var(--orange)}.done{background:#ecfdf5;color:var(--green)}.doing{background:var(--blue2);color:#1d4ed8}.over{color:#dc2626;font-weight:700}.member{padding:11px 0;border-bottom:1px solid #edf0f4;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;align-items:center}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,.25)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:20px;margin:0}.modal-close{border:0;background:transparent;font-size:26px;cursor:pointer;color:#64748b}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:18px 22px;border-top:1px solid var(--line);background:#fafbfc}.helper{font-size:12px;color:var(--muted);margin-top:5px}.required{color:#dc2626}.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:9px;z-index:1100;box-shadow:0 12px 30px rgba(0,0,0,.22)}
    @media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.top{padding:14px}.wrap{padding:12px}.member,.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.nav{width:100%}.modal{width:100%}}
  </style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<script src="app.js?v=1.2"></script>
</body>
</html>
