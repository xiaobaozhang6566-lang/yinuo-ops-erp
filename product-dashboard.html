<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMU US 商品经营驾驶舱 P0-8</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#718096}.card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;box-shadow:0 8px 28px rgba(25,40,65,.05);padding:18px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}select,input,button{font:inherit;padding:11px 12px;border-radius:10px}select,input{border:1px solid #d7dde8;background:#fff}button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e9edf4;color:#172033}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.kpi{font-size:26px;font-weight:780;margin-top:6px}.delta{font-size:12px;margin-top:5px}.up{color:#047857}.down{color:#b42318}.flat{color:#64748b}.section{margin-top:14px}.twocol{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.stategrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.state{background:#f8fafc;border:1px solid #e7ebf2;border-radius:10px;padding:10px}.state b{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.diag{border-left:4px solid #d7dde8;padding:10px 12px;background:#f8fafc;border-radius:8px;margin-top:8px}.diag.critical{border-left-color:#b42318}.diag.info{border-left-color:#2563eb}.diag.watch{border-left-color:#c27a00}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:12px;margin-right:5px}.tag.good{background:#ecfdf5;color:#047857}.tag.bad{background:#fff1f2;color:#b42318}.hourbar{display:grid;grid-template-columns:42px 1fr 70px 70px 70px;gap:8px;align-items:center;font-size:12px;margin:6px 0}.bar{height:9px;background:#e9edf4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#64748b;border-radius:999px}.callout{padding:12px;border-radius:10px;background:#eef6ff;border:1px solid #cfe4ff}.err{padding:12px;border-radius:10px;background:#fff1f2;color:#b42318}.title{font-size:18px;font-weight:760}.summaryline{margin-top:6px;color:#475569}.pill{background:#eaf0ff;color:#3452a4;padding:6px 10px;border-radius:999px;font-size:13px}.trend{display:flex;gap:6px;align-items:end;height:88px;padding-top:8px}.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.trend .stick{width:70%;background:#94a3b8;border-radius:5px 5px 0 0;min-height:3px}.trend .lab{font-size:10px;color:#64748b;margin-top:4px}.rank{margin-top:8px}.rank b{display:inline-block;min-width:48px}.notice{padding:10px 12px;border-radius:10px;background:#eef6ff;border:1px solid #cfe4ff;color:#34527a;font-size:13px}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.twocol{grid-template-columns:1fr}.threecol{grid-template-columns:1fr}.stategrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.stategrid{grid-template-columns:repeat(2,1fr)}.app{padding:12px}.hourbar{grid-template-columns:36px 1fr 55px 55px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div><h1 style="margin:0">TEMU US 商品经营驾驶舱</h1><div class="muted">P0-8 · 单商品经营分析 / AI诊断 / 小时结构 / 实验状态</div></div><div><span class="pill">独立测试页</span> <button class="secondary" onclick="location.href='/'">返回P0主系统</button></div></div>
<div class="controls card"><select id="store"></select><input id="product" value="606297378402192" placeholder="商品ID" style="min-width:230px"><select id="days"><option value="7">近7天</option><option value="14">近14天</option><option value="30">近30天</option></select><button id="load">加载驾驶舱</button><span id="status" class="muted"></span></div>
<div id="root"><div class="card muted">点击“加载驾驶舱”。如果店铺列表为空，请先在主系统登录。</div></div>
</main>
<script>
const SUPABASE_URL='https://iscadepgzegrvcqzosso.supabase.co',KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2',API=SUPABASE_URL+'/functions/v1/temu-ops';const tok=localStorage.getItem('temu_token')||'';const q=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path,p={}){const u=new URL(API);u.searchParams.set('api',path);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{headers:{apikey:KEY,authorization:'Bearer '+tok}});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
const n=v=>Number(v)||0, fp=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(2)+'%':'-', fn=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'-', money=v=>Number.isFinite(Number(v))?'¥'+Number(v).toFixed(0):'-';
function delta(v){if(v===null||v===undefined||!Number.isFinite(Number(v)))return '<span class="flat">—</span>';const p=Number(v)*100,cls=p>0.05?'up':p<-0.05?'down':'flat';return `<span class="${cls}">${p>=0?'+':''}${p.toFixed(1)}%</span>`}
function kpi(name,value,chg,sub=''){return `<div class="card"><div class="muted">${name}</div><div class="kpi">${value}</div><div class="delta">最新日 vs 前期均值 ${delta(chg)}</div>${sub?`<div class="muted" style="font-size:11px;margin-top:3px">${sub}</div>`:''}</div>`}
function trend(daily,key){const vals=daily.map(x=>n(x[key])),mx=Math.max(...vals,1);return `<div class="trend">${daily.map((x,i)=>`<div class="col"><div class="stick" style="height:${Math.max(4,vals[i]/mx*70)}px"></div><div class="lab">${String(x.business_date).slice(5)}</div></div>`).join('')}</div>`}
function stateHtml(states){if(!states.length)return '<div class="muted">尚未初始化商品状态。</div>';const s=states[0];return `<div class="stategrid"><div class="state"><b>ROI目标</b>${esc(s.roi_target??'-')}</div><div class="state"><b>前端售价</b>${s.front_price!=null?'$'+esc(s.front_price):'-'} ${s.front_price_is_final_after_coupon?'（券后最终价）':''}</div><div class="state"><b>活动价</b>${s.campaign_price!=null?'$'+esc(s.campaign_price):'-'}</div><div class="state"><b>优惠券</b>${s.coupon_status?'开启':'关闭'} ${s.coupon_amount!=null?'$'+esc(s.coupon_amount):''}</div><div class="state"><b>广告预算</b>${esc(s.daily_budget??'-')}</div><div class="state"><b>库存 / 售罄</b>${esc(s.inventory_status||'-')} / ${esc(s.soldout_status||'-')}</div><div class="state"><b>核心尺码售罄</b>${s.core_size_stockout?'是':'否'}</div><div class="state"><b>主图版本</b>${esc(s.main_image_version||'-')}</div><div class="state"><b>状态生效</b>${s.state_effective_at?new Date(s.state_effective_at).toLocaleString():'-'}</div></div>`}
function diagnosticsHtml(ds){if(!ds.length)return '<div class="muted">暂无AI诊断。</div>';return ds.slice(0,4).map(d=>`<div class="diag ${d.severity==='CRITICAL'?'critical':d.severity==='INFO'?'info':'watch'}"><div><span class="tag">${esc(d.business_date)}</span><b>${esc(d.diagnosis_type)}</b> <span class="tag">${esc(d.severity)}</span> <span class="tag">Priority ${esc(d.action_priority??'-')}</span></div><div class="summaryline">${esc(d.recommended_action||'-')}</div></div>`).join('')}
function hourRows(hours){if(!hours.length)return '<div class="muted">暂无小时数据。</div>';const mx=Math.max(...hours.map(h=>h.orders),1);return hours.map(h=>`<div class="hourbar"><b>${String(h.source_hour).padStart(2,'0')}:00</b><div class="bar"><i style="width:${Math.max(1,h.orders/mx*100)}%"></i></div><span>${h.orders}单</span><span>CVR ${fp(h.cvr)}</span><span>R ${fn(h.roas,1)}</span></div>`).join('')}
function ranks(ins){const f=(arr,label)=>`<div class="rank"><b>${label}</b>${(arr||[]).map(x=>`<span class="tag">${String(x.source_hour).padStart(2,'0')}:00 · ${x.orders}单 · R${fn(x.roas,1)}</span>`).join('')||'—'}</div>`;return f(ins.top_orders,'订单高')+f(ins.high_roas,'高ROAS')+f(ins.weak_conversion,'弱转化')}
function experimentHtml(e){if(!e)return '<div class="muted">当前没有运行中的实验。</div>';const old=e.old_value?.value??'-',nv=e.new_value?.value??'-';return `<div class="callout"><b>${esc(e.experiment_type)}实验运行中：${esc(old)} → ${esc(nv)}</b><div class="summaryline">主指标 ${esc(e.primary_metric)} · ${e.contamination_status==='CONTAMINATED'?'实验受污染':'CLEAN 单变量'}</div><div class="summaryline">变更时间：${new Date(e.treatment_start).toLocaleString()}；观察至：${new Date(e.observe_until).toLocaleString()}</div></div>`}
function render(d){const s=d.summary||{},l=d.latest||{},dd=d.deltas||{},daily=d.daily||[];q('root').innerHTML=`<div class="card"><div class="title">${esc(d.product?.product_name||'商品')}</div><div class="summaryline">商品ID ${esc(d.product?.product_id||'-')} · SPU ${esc(d.product?.spu||'-')} · 数据 ${daily[0]?.business_date||'-'} ~ ${daily[daily.length-1]?.business_date||'-'}</div></div><div class="grid section">${kpi('曝光',Math.round(s.impressions).toLocaleString(),dd.impressions)}${kpi('点击',Math.round(s.clicks).toLocaleString(),dd.clicks)}${kpi('CTR',fp(s.ctr),dd.ctr)}${kpi('加购',Math.round(s.carts).toLocaleString(),null,'点击→加购 '+fp(s.cart_rate))}${kpi('订单',Math.round(s.orders).toLocaleString(),dd.orders,'加购→订单 '+fp(s.cart_to_order))}${kpi('CVR',fp(s.cvr),dd.cvr)}${kpi('ROAS',fn(s.roas,2),dd.roas,'净ROAS '+fn(s.net_roas,2))}</div><div class="twocol section"><div class="card"><h2 style="margin-top:0">近${daily.length}天趋势</h2><div class="muted">订单</div>${trend(daily,'suborder_count')}<div class="muted">曝光</div>${trend(daily,'impressions')}<div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>曝光</th><th>CTR</th><th>加购</th><th>订单</th><th>CVR</th><th>ROAS</th><th>净ROAS</th></tr></thead><tbody>${daily.map(x=>`<tr><td>${x.business_date}</td><td>${Math.round(n(x.impressions)).toLocaleString()}</td><td>${fp(x.ctr)}</td><td>${n(x.add_to_cart_count)}</td><td>${n(x.suborder_count)}</td><td>${fp(x.cvr)}</td><td>${fn(x.roas,2)}</td><td>${fn(x.net_roas,2)}</td></tr>`).join('')}</tbody></table></div></div><div><div class="card"><h2 style="margin-top:0">当前商业状态</h2>${stateHtml(d.states||[])}</div><div class="card section"><h2 style="margin-top:0">当前实验</h2>${experimentHtml(d.current_experiment)}</div></div></div><div class="threecol section"><div class="card"><h2 style="margin-top:0">AI诊断</h2>${diagnosticsHtml(d.diagnostics||[])}</div><div class="card"><h2 style="margin-top:0">24小时结构</h2>${ranks(d.hour_insights||{})}</div><div class="card"><h2 style="margin-top:0">小时明细</h2><div style="max-height:420px;overflow:auto">${hourRows(d.hourly||[])}</div></div></div>`}
async function boot(){if(!tok){q('root').innerHTML='<div class="err">当前浏览器没有登录凭证。请先返回P0主系统登录，然后再打开本页。</div>';return}try{const d=await get('dashboard');q('store').innerHTML=(d.stores||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.store_name)}</option>`).join('');const s=(d.stores||[]).find(x=>x.store_name==='8号');if(s)q('store').value=s.id;q('status').textContent='已登录'}catch(e){q('root').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
q('load').onclick=async()=>{try{q('status').textContent='加载中...';const d=await get('product-dashboard',{store_id:q('store').value,product_id:q('product').value.trim(),days:q('days').value});render(d);q('status').textContent='已加载'}catch(e){q('root').innerHTML=`<div class="err">${esc(e.message)}</div>`;q('status').textContent='加载失败'}};
boot();
</script>
</body></html>
