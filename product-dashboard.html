<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMU US 商品经营驾驶舱 P0-8.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#718096}.card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;box-shadow:0 8px 28px rgba(25,40,65,.05);padding:18px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}select,input,button{font:inherit;padding:11px 12px;border-radius:10px}select,input{border:1px solid #d7dde8;background:#fff}button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e9edf4;color:#172033}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.kpi{font-size:26px;font-weight:780;margin-top:6px}.delta{font-size:12px;margin-top:5px}.up{color:#047857}.down{color:#b42318}.flat{color:#64748b}.section{margin-top:14px}.twocol{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.decisiongrid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}.decision{padding:16px;border-radius:14px;background:#0f172a;color:#fff}.decision h2{margin:0 0 8px;font-size:20px}.decision p{margin:5px 0;color:#dbeafe;line-height:1.55}.decision .big{font-size:18px;font-weight:760;color:#fff}.decisionlite{padding:16px;border-radius:14px;background:#fff;border:1px solid #e4e9f1}.decisionlite h3{margin:0 0 8px}.statusgood{color:#047857;font-weight:720}.statuswarn{color:#9a6700;font-weight:720}.statusbad{color:#b42318;font-weight:720}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.stategrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.state{background:#f8fafc;border:1px solid #e7ebf2;border-radius:10px;padding:10px}.state b{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.diag{border-left:4px solid #d7dde8;padding:10px 12px;background:#f8fafc;border-radius:8px;margin-top:8px}.diag.critical{border-left-color:#b42318}.diag.info{border-left-color:#2563eb}.diag.watch{border-left-color:#c27a00}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;font-size:12px;margin-right:5px}.tag.good{background:#ecfdf5;color:#047857}.tag.bad{background:#fff1f2;color:#b42318}.hourbar{display:grid;grid-template-columns:42px 1fr 70px 70px 70px;gap:8px;align-items:center;font-size:12px;margin:6px 0}.bar{height:9px;background:#e9edf4;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#64748b;border-radius:999px}.callout{padding:12px;border-radius:10px;background:#eef6ff;border:1px solid #cfe4ff}.err{padding:12px;border-radius:10px;background:#fff1f2;color:#b42318}.title{font-size:18px;font-weight:760}.summaryline{margin-top:6px;color:#475569}.pill{background:#eaf0ff;color:#3452a4;padding:6px 10px;border-radius:999px;font-size:13px}.trend{display:flex;gap:6px;align-items:end;height:88px;padding-top:8px}.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.trend .stick{width:70%;background:#94a3b8;border-radius:5px 5px 0 0;min-height:3px}.trend .lab{font-size:10px;color:#64748b;margin-top:4px}.rank{margin-top:9px;line-height:1.9}.rank b{display:inline-block;min-width:58px}.notice{padding:10px 12px;border-radius:10px;background:#eef6ff;border:1px solid #cfe4ff;color:#34527a;font-size:13px}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.twocol,.decisiongrid{grid-template-columns:1fr}.threecol{grid-template-columns:1fr}.stategrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.stategrid{grid-template-columns:repeat(2,1fr)}.app{padding:12px}.hourbar{grid-template-columns:36px 1fr 55px 55px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div><h1 style="margin:0">TEMU US 商品经营驾驶舱</h1><div class="muted">P0-8.1 · 首屏决策 / 经营漏斗 / AI诊断 / 小时结构 / 实验状态</div></div><div><span class="pill">独立测试页</span> <button class="secondary" onclick="location.href='/'">返回P0主系统</button></div></div>
<div class="controls card"><select id="store"></select><input id="product" value="606297378402192" placeholder="商品ID" style="min-width:230px"><select id="days"><option value="7">近7天</option><option value="14">近14天</option><option value="30">近30天</option></select><button id="load">加载驾驶舱</button><span id="status" class="muted"></span></div>
<div id="root"><div class="card muted">点击“加载驾驶舱”。如果店铺列表为空，请先在主系统登录。</div></div>
</main>
<script>
const SUPABASE_URL='https://iscadepgzegrvcqzosso.supabase.co',KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2',API=SUPABASE_URL+'/functions/v1/temu-ops';const tok=localStorage.getItem('temu_token')||'';const q=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path,p={}){const u=new URL(API);u.searchParams.set('api',path);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{headers:{apikey:KEY,authorization:'Bearer '+tok}});const d=await r.json();if(!r.ok)throw new Error(d.error||'请求失败');return d}
const n=v=>Number(v)||0, fp=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(2)+'%':'-', fn=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'-';
function delta(v){if(v===null||v===undefined||!Number.isFinite(Number(v)))return '<span class="flat">—</span>';const p=Number(v)*100,cls=p>0.05?'up':p<-0.05?'down':'flat';return `<span class="${cls}">${p>=0?'+':''}${p.toFixed(1)}%</span>`}
function rawDelta(after,before){const a=Number(after),b=Number(before);return Number.isFinite(a)&&Number.isFinite(b)&&b!==0?(a-b)/b:null}
function kpi(name,value,chg,sub=''){return `<div class="card"><div class="muted">${name}</div><div class="kpi">${value}</div><div class="delta">最新日 vs 前期均值 ${delta(chg)}</div>${sub?`<div class="muted" style="font-size:11px;margin-top:3px">${sub}</div>`:''}</div>`}
function trend(daily,key){const vals=daily.map(x=>n(x[key])),mx=Math.max(...vals,1);return `<div class="trend">${daily.map((x,i)=>`<div class="col"><div class="stick" style="height:${Math.max(4,vals[i]/mx*70)}px"></div><div class="lab">${String(x.business_date).slice(5)}</div></div>`).join('')}</div>`}
function stateHtml(states){if(!states.length)return '<div class="muted">尚未初始化商品状态。</div>';const s=states[0];return `<div class="stategrid"><div class="state"><b>ROI目标</b>${esc(s.roi_target??'-')}</div><div class="state"><b>前端售价</b>${s.front_price!=null?'$'+esc(s.front_price):'-'} ${s.front_price_is_final_after_coupon?'（券后最终价）':''}</div><div class="state"><b>活动价</b>${s.campaign_price!=null?'$'+esc(s.campaign_price):'-'}</div><div class="state"><b>优惠券</b>${s.coupon_status?'开启':'关闭'} ${s.coupon_amount!=null?'$'+esc(s.coupon_amount):''}</div><div class="state"><b>广告预算</b>${esc(s.daily_budget??'-')}</div><div class="state"><b>库存 / 售罄</b>${esc(s.inventory_status||'-')} / ${esc(s.soldout_status||'-')}</div><div class="state"><b>核心尺码售罄</b>${s.core_size_stockout?'是':'否'}</div><div class="state"><b>主图版本</b>${esc(s.main_image_version||'-')}</div><div class="state"><b>状态生效</b>${s.state_effective_at?new Date(s.state_effective_at).toLocaleString():'-'}</div></div>${s.front_price_is_final_after_coupon?'<div class="notice" style="margin-top:8px">前端售价已标记为券后最终展示价：AI分析不会再次扣减优惠券。</div>':''}`}
function diagnosticsHtml(ds){if(!ds.length)return '<div class="muted">暂无AI诊断。</div>';return ds.slice(0,4).map(d=>`<div class="diag ${d.severity==='CRITICAL'?'critical':d.severity==='INFO'?'info':'watch'}"><div><span class="tag">${esc(d.business_date)}</span><b>${esc(d.diagnosis_type)}</b> <span class="tag">${esc(d.severity)}</span> <span class="tag">Priority ${esc(d.action_priority??'-')}</span></div><div class="summaryline">${esc(d.recommended_action||'-')}</div></div>`).join('')}
function hourRows(hours){if(!hours.length)return '<div class="muted">暂无小时数据。</div>';const mx=Math.max(...hours.map(h=>h.orders),1);return hours.map(h=>`<div class="hourbar"><b>${String(h.source_hour).padStart(2,'0')}:00</b><div class="bar"><i style="width:${Math.max(1,h.orders/mx*100)}%"></i></div><span>${h.orders}单</span><span>CVR ${fp(h.cvr)}</span><span>R ${fn(h.roas,1)}</span></div>`).join('')}
function betterHourInsights(d){const hs=d.hourly||[],s=d.summary||{};if(!hs.length)return {scale:[],orders:[],weak:[]};const avgOrders=hs.reduce((a,x)=>a+n(x.orders),0)/hs.length,avgClicks=hs.reduce((a,x)=>a+n(x.clicks),0)/hs.length,baseR=n(s.roas),baseC=n(s.cvr);const scale=hs.filter(x=>n(x.orders)>=avgOrders*.8&&n(x.roas)>=baseR).sort((a,b)=>(b.orders*(b.roas/baseR))-(a.orders*(a.roas/baseR))).slice(0,3);const orders=[...hs].sort((a,b)=>b.orders-a.orders).slice(0,3);const weak=hs.filter(x=>n(x.clicks)>=avgClicks*.7&&n(x.cvr)<baseC*.8).sort((a,b)=>a.cvr-b.cvr).slice(0,3);return {scale,orders,weak}}
function ranks(d){const ins=betterHourInsights(d),f=(arr,label)=>`<div class="rank"><b>${label}</b>${(arr||[]).map(x=>`<span class="tag">${String(x.source_hour).padStart(2,'0')}:00 · ${x.orders}单 · CVR${fp(x.cvr)} · R${fn(x.roas,1)}</span>`).join('')||'—'}</div>`;return f(ins.scale,'可放量')+f(ins.orders,'订单高')+f(ins.weak,'弱转化')+'<div class="muted" style="font-size:11px;margin-top:8px">“可放量”同时要求订单样本和ROAS达到基线，避免把低样本高ROAS误判为优质时段。</div>'}
function experimentHtml(e){if(!e)return '<div class="muted">当前没有运行中的实验。</div>';const old=e.old_value?.value??'-',nv=e.new_value?.value??'-';return `<div class="callout"><b>${esc(e.experiment_type)}实验运行中：${esc(old)} → ${esc(nv)}</b><div class="summaryline">主指标 ${esc(e.primary_metric)} · ${e.contamination_status==='CONTAMINATED'?'实验受污染':'CLEAN 单变量'}</div><div class="summaryline">变更时间：${new Date(e.treatment_start).toLocaleString()}；观察至：${new Date(e.observe_until).toLocaleString()}</div></div>`}
function shanghaiYmd(ts){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts))}
function addDay(ymd,n){const [y,m,d]=ymd.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+n));return `${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}-${String(x.getUTCDate()).padStart(2,'0')}`}
function decisionCards(d){const daily=d.daily||[],latest=d.latest||{},dd=d.deltas||{},exp=d.current_experiment,diag=(d.diagnostics||[])[0],latestDate=latest.business_date||'-';const prev=daily.slice(0,-1),prevCarts=prev.reduce((a,x)=>a+n(x.add_to_cart_count),0),prevOrders=prev.reduce((a,x)=>a+n(x.suborder_count),0),prevCartToOrder=prevCarts?prevOrders/prevCarts:null,latestCartToOrder=n(latest.add_to_cart_count)?n(latest.suborder_count)/n(latest.add_to_cart_count):null,ctoDelta=rawDelta(latestCartToOrder,prevCartToOrder);let headline='经营表现基本稳定',detail='当前未发现需要立即动作的强信号。';if((dd.impressions??0)>0&&(dd.clicks??0)>0&&(dd.cvr??0)<-.05){headline='流量上升，但成交效率承压';detail=`最新日曝光 ${delta(dd.impressions)}、点击 ${delta(dd.clicks)}，但CVR ${delta(dd.cvr)}；加购→订单 ${fp(latestCartToOrder)}，较前期 ${delta(ctoDelta)}。优先排查成交端变量，不要先动主图。`}else if((dd.orders??0)>.05&&(dd.roas??0)>-.05){headline='订单与效率同步改善';detail='当前更接近可放量状态，建议保持单变量并继续验证。'}if(diag?.severity==='CRITICAL'){headline='AI识别到高优先级成交异常';detail=diag.recommended_action||detail}
let dataStatus='当前数据可用于经营判断',dataClass='statusgood',next='继续按日上传数据并观察AI诊断。';if(exp){const transition=shanghaiYmd(exp.treatment_start),first=addDay(transition,1);if(latestDate<transition){dataStatus='当前全部是实验前基线数据';dataClass='statuswarn';next=`ROI ${exp.old_value?.value??'-'}→${exp.new_value?.value??'-'} 已开始，但数据只到 ${latestDate}。下一步上传 ${first} 完整日数据；在24H结果前不要再改ROI/价格/优惠券/预算/主图。`}else if(latestDate===transition){dataStatus='仅覆盖变更过渡日，暂不能评价实验';dataClass='statuswarn';next=`${transition} 是过渡日，不参与因果判断。等待 ${first} 完整实验日数据。`}else{const fullDays=Math.max(0,Math.round((new Date(latestDate+'T00:00:00Z')-new Date(first+'T00:00:00Z'))/86400000)+1);dataStatus=`已覆盖 ${fullDays} 个完整实验日`;dataClass=fullDays>=1?'statusgood':'statuswarn';next='保持单变量，等待系统自动生成24H/72H/7D结论。'}}
return `<div class="decisiongrid section"><div class="decision"><h2>AI经营结论</h2><div class="big">${esc(headline)}</div><p>${detail}</p>${diag?`<p>最新诊断：${esc(diag.diagnosis_type)} · Priority ${esc(diag.action_priority??'-')}</p>`:''}</div><div class="decisionlite"><h3>数据状态</h3><div class="${dataClass}">${esc(dataStatus)}</div><div class="summaryline">最新数据：${esc(latestDate)}</div><div class="summaryline">7天漏斗：点击→加购 ${fp(d.summary?.cart_rate)}；加购→订单 ${fp(d.summary?.cart_to_order)}</div></div><div class="decisionlite"><h3>下一步动作</h3><div class="summaryline">${esc(next)}</div></div></div>`}
function render(d){const s=d.summary||{},l=d.latest||{},dd=d.deltas||{},daily=d.daily||[],prev=daily.slice(0,-1),prevCarts=prev.reduce((a,x)=>a+n(x.add_to_cart_count),0),prevOrders=prev.reduce((a,x)=>a+n(x.suborder_count),0),prevCart=prevCarts?prevOrders/prevCarts:null,latestCart=n(l.add_to_cart_count)?n(l.suborder_count)/n(l.add_to_cart_count):null,cartDelta=rawDelta(latestCart,prevCart),prevCartCount=prev.length?prev.reduce((a,x)=>a+n(x.add_to_cart_count),0)/prev.length:null,cartCountDelta=rawDelta(l.add_to_cart_count,prevCartCount);q('root').innerHTML=`<div class="card"><div class="title">${esc(d.product?.product_name||'商品')}</div><div class="summaryline">商品ID ${esc(d.product?.product_id||'-')} · SPU ${esc(d.product?.spu||'-')} · 数据 ${daily[0]?.business_date||'-'} ~ ${daily[daily.length-1]?.business_date||'-'}</div></div>${decisionCards(d)}<div class="grid section">${kpi('曝光',Math.round(s.impressions).toLocaleString(),dd.impressions)}${kpi('点击',Math.round(s.clicks).toLocaleString(),dd.clicks)}${kpi('CTR',fp(s.ctr),dd.ctr)}${kpi('加购',Math.round(s.carts).toLocaleString(),cartCountDelta,'7天点击→加购 '+fp(s.cart_rate))}${kpi('订单',Math.round(s.orders).toLocaleString(),dd.orders,'最新加购→订单 '+fp(latestCart)+'；7天 '+fp(s.cart_to_order))}${kpi('CVR',fp(s.cvr),dd.cvr)}${kpi('ROAS',fn(s.roas,2),dd.roas,'净ROAS '+fn(s.net_roas,2))}</div><div class="twocol section"><div class="card"><h2 style="margin-top:0">近${daily.length}天趋势</h2><div class="muted">订单</div>${trend(daily,'suborder_count')}<div class="muted">曝光</div>${trend(daily,'impressions')}<div class="tablewrap"><table class="table"><thead><tr><th>日期</th><th>曝光</th><th>CTR</th><th>加购</th><th>订单</th><th>加购→订单</th><th>CVR</th><th>ROAS</th><th>净ROAS</th></tr></thead><tbody>${daily.map(x=>`<tr><td>${x.business_date}</td><td>${Math.round(n(x.impressions)).toLocaleString()}</td><td>${fp(x.ctr)}</td><td>${n(x.add_to_cart_count)}</td><td>${n(x.suborder_count)}</td><td>${fp(n(x.add_to_cart_count)?n(x.suborder_count)/n(x.add_to_cart_count):null)}</td><td>${fp(x.cvr)}</td><td>${fn(x.roas,2)}</td><td>${fn(x.net_roas,2)}</td></tr>`).join('')}</tbody></table></div></div><div><div class="card"><h2 style="margin-top:0">当前商业状态</h2>${stateHtml(d.states||[])}</div><div class="card section"><h2 style="margin-top:0">当前实验</h2>${experimentHtml(d.current_experiment)}</div></div></div><div class="threecol section"><div class="card"><h2 style="margin-top:0">AI诊断</h2>${diagnosticsHtml(d.diagnostics||[])}</div><div class="card"><h2 style="margin-top:0">24小时结构</h2>${ranks(d)}</div><div class="card"><h2 style="margin-top:0">小时明细</h2><div style="max-height:420px;overflow:auto">${hourRows(d.hourly||[])}</div></div></div>`}
async function boot(){if(!tok){q('root').innerHTML='<div class="err">当前浏览器没有登录凭证。请先返回P0主系统登录，然后再打开本页。</div>';return}try{const d=await get('dashboard');q('store').innerHTML=(d.stores||[]).map(s=>`<option value="${esc(s.id)}">${esc(s.store_name)}</option>`).join('');const s=(d.stores||[]).find(x=>x.store_name==='8号');if(s)q('store').value=s.id;q('status').textContent='已登录'}catch(e){q('root').innerHTML=`<div class="err">${esc(e.message)}</div>`}}
q('load').onclick=async()=>{try{q('status').textContent='加载中...';const d=await get('product-dashboard',{store_id:q('store').value,product_id:q('product').value.trim(),days:q('days').value});render(d);q('status').textContent='已加载'}catch(e){q('root').innerHTML=`<div class="err">${esc(e.message)}</div>`;q('status').textContent='加载失败'}};
boot();
</script>
</body></html>
