<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亦诺·正式商品身份同步审核</title><style>body{font:15px system-ui,"Microsoft YaHei";background:#f4f7fb;color:#16233c;margin:0}main{max-width:1150px;margin:auto;padding:25px}.card{background:white;border:1px solid #dee5ee;border-radius:14px;padding:20px;margin:16px 0}h1{margin:0 0 8px}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd6e4}button{background:#13213c;color:white;border:0;cursor:pointer}.note{background:#edf4ff;padding:14px;border-radius:9px;line-height:1.8}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e5eaf2}th{background:#f4f7fb}.scroll{overflow:auto}.error{color:#ad2633}.ok{color:#087344}.hidden{display:none}a{color:#335caa}</style></head><body><main><div class="row"><div><h1>正式商品身份库 · 审核同步</h1><div>AI OS 独立测试版 · 审核后写入权威商品身份库</div></div><a style="margin-left:auto" href="/temu-pairing.html">返回配对中心</a></div><div class="note">操作流程：先在配对中心绑定店铺和SPU款式 → 提交审核 → 对比正式关系 → 管理员逐条确认。正式映射不同的覆盖申请须由另一名Manager复核。审批时会再次核查版本，避免覆盖别人最新修改。</div><div id="login" class="card"><h2>使用公司管理员账号</h2><div class="row"><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button id="loginBtn">登录</button></div><p id="loginMsg" class="error"></p></div><div id="app" class="hidden"><section class="card"><h2>① 提交同步审核</h2><p>从已经保存在AI OS测试层的配对中选择：</p><div class="row"><select id="pairPick"></select><input id="submitReason" style="min-width:350px" placeholder="提交说明（有冲突时至少8字）"><button id="submit">提交审核</button></div><p id="submitMsg"></p></section><section class="card"><div class="row"><h2>② 审核队列</h2><button id="reload" style="margin-left:auto">刷新</button></div><div id="queue" class="scroll"></div></section><section class="card"><h2>③ 审核决策</h2><p id="selected">请从审核队列选择一条。</p><div class="row"><input id="confirmSpu" placeholder="确认批准时，完整输入SPU"><input id="reviewReason" style="min-width:370px" placeholder="审核意见/拒绝理由"><button id="approve">批准并同步</button><button id="reject">拒绝</button></div><p id="reviewMsg"></p><p>审核通过即写入正式库；已生效的旧配对不会静默覆盖。相同配对只做一致性确认，不重复写入。</p></section></div></main><script>
const BASE='https://iscadepgzegrvcqzosso.supabase.co',KEY='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2',END=BASE+'/functions/v1/temu-ads-v1';let token=localStorage.getItem('temu_token')||'',context=null,requests=[],selectedId=null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=(id,s,bad=false)=>{ $(id).textContent=s;$(id).className=bad?'error':'ok' };
async function call(api,body){const r=await fetch(END+'?api='+api,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+token},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function official(p){const alias=context.aliases.find(a=>a.raw_store_name===p.raw_store_name),m=alias&&context.legacy.find(x=>x.store_id===alias.store_id&&x.spu===p.spu);return context.styles.find(x=>x.id===m?.style_id)?.style_code||null}
function draw(){const pairs=context.pairings;const prev=$('pairPick').value;$('pairPick').innerHTML=pairs.map((p,i)=>'<option value="'+i+'">'+esc(p.raw_store_name)+' / '+esc(p.spu)+' → '+esc(p.style_code)+'</option>').join('');if(prev&&Number(prev)<pairs.length)$('pairPick').value=prev;
$('queue').innerHTML='<table><thead><tr><th>状态</th><th>来源店铺</th><th>SPU</th><th>正式旧款式</th><th>申请新款式</th><th>变更类型</th><th>申请时间</th><th>操作</th></tr></thead><tbody>'+requests.map((r,i)=>'<tr><td>'+esc(r.status)+'</td><td>'+esc(r.raw_store_name)+'</td><td>'+esc(r.spu)+'</td><td>'+esc(official(r)||'—')+'</td><td>'+esc(r.style_code)+'</td><td>'+esc(r.sync_action)+'</td><td>'+esc(r.requested_at?.slice(0,19))+'</td><td><button data-index="'+i+'">选择</button></td></tr>').join('')+'</tbody></table>';
document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let r=requests[Number(b.dataset.index)];selectedId=r.id;$('selected').textContent=r.raw_store_name+' / '+r.spu+'：正式旧款式 '+(official(r)||'无')+' → '+r.style_code+'；类型 '+r.sync_action+'；状态 '+r.status;$('confirmSpu').value='';$('reviewReason').value='';});}
async function load(){const [p,r]=await Promise.all([call('pairing-context'),call('sync-requests')]);context=p;requests=r.requests;$('login').classList.add('hidden');$('app').classList.remove('hidden');draw();}
$('loginBtn').onclick=async()=>{try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'登录失败');token=j.access_token;localStorage.setItem('temu_token',token);await load()}catch(e){msg('loginMsg',e.message,true)}};
$('reload').onclick=()=>load().catch(e=>msg('reviewMsg',e.message,true));
$('submit').onclick=async()=>{try{const p=context.pairings[Number($('pairPick').value)];if(!p)throw Error('没有可提交的测试配对');const r=await call('sync-action',{action:'submit',raw_store_name:p.raw_store_name,spu:p.spu,reason:$('submitReason').value});msg('submitMsg','提交成功：'+r.action+'，等待审核。');await load()}catch(e){msg('submitMsg',e.message,true)}};
async function review(decision){try{const r=requests.find(x=>x.id===selectedId);if(!r)throw Error('请先选择审核请求');if(r.status!=='PENDING')throw Error('只有待审核请求可以处理');if(decision==='APPROVE'&&!confirm('将同步到正式商品身份库，关联订单及商品数据也可能更新。确认继续？'))return;const j=await call('sync-action',{action:'review',request_id:r.id,decision,confirm_spu:$('confirmSpu').value, note:$('reviewReason').value});msg('reviewMsg',j.status==='STALE'?'审批已阻止：配对发生变化，需要重新提交':'审核结果：'+j.status,j.status==='STALE');await load()}catch(e){msg('reviewMsg',e.message,true)}}
$('approve').onclick=()=>review('APPROVE');$('reject').onclick=()=>review('REJECT');
if(token)load().catch(e=>msg('loginMsg',e.message,true));
</script></body></html>
