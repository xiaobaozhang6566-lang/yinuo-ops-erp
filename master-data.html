<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>基础配对 V2 · P0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033}
.top{height:62px;background:#fff;border-bottom:1px solid #e4e9f1;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-weight:850}.muted{color:#718096}.wrap{max-width:1440px;margin:auto;padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:750;cursor:pointer}.blue{background:#111827;color:#fff}.gray{background:#e9edf4;color:#172033}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;background:#e9edf4;color:#172033}.tab.on{background:#111827;color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid #e4e9f1;border-radius:14px;box-shadow:0 2px 10px rgba(25,40,65,.04)}.card{padding:15px}.num{font-size:26px;font-weight:850;margin-top:5px}.panel{overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between;gap:12px}.body{padding:16px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:960px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:middle}.table th{font-size:12px;color:#64748b;background:#f8fafc}.table td{font-size:14px}
.input{width:100%;border:1px solid #d8dee8;border-radius:8px;padding:9px 10px;background:#fff}.select{min-width:155px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters .input{width:auto;min-width:180px}
.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2f7;font-weight:750}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.msg{margin:12px 0;padding:10px 12px;border-radius:9px;background:#fff7ed;color:#9a3412}.empty{padding:24px;text-align:center;color:#718096}.hidden{display:none!important}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:18px;z-index:1000}.modal{width:min(720px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #edf1f6}.modal-head h2{margin:0;font-size:19px}.modal-close{border:0;background:#eef2f7;border-radius:8px;width:34px;height:34px;font-size:22px;cursor:pointer}.modal-body{padding:18px 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid #edf1f6}
.history-item{padding:12px 0;border-bottom:1px solid #edf1f6}.history-item:last-child{border-bottom:0}.history-title{font-weight:800}.history-sub{font-size:13px;color:#64748b;margin-top:4px}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:12px}.top{padding:0 12px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.tabs{overflow:auto}.tab{white-space:nowrap}}
</style>
</head>
<body>
<header class="top"><div class="brand">亦诺跨境 · 基础配对 <span class="muted">V2 独立测试</span></div><div class="toolbar"><button class="btn gray" id="backBtn" onclick="location.href='/p0-home.html'">返回P0主系统</button><button class="btn blue" id="refreshBtn">刷新</button></div></header>
<main class="wrap">
<div class="tabs">
  <button class="tab on" id="tabStores" onclick="switchTab('stores')">店铺负责人</button>
  <button class="tab" id="tabStyles" onclick="switchTab('styles')">款式库</button>
  <button class="tab" id="tabPairing" onclick="switchTab('pairing')">SPU配对</button>
  <button class="tab" id="tabHistory" onclick="switchTab('history')">配对记录</button>
</div>
<div class="cards">
 <div class="card">店铺<div class="num" id="storeCount">—</div></div>
 <div class="card">统一款式<div class="num" id="styleCount">—</div></div>
 <div class="card">已配对SPU<div class="num" id="pairedCount">—</div></div>
 <div class="card">未配对SPU<div class="num" id="unpairedCount">—</div></div>
</div>
<div id="msg"></div>

<section id="viewStores" class="panel">
 <div class="head"><div><b>店铺主数据</b><div class="muted" style="margin-top:4px;font-size:13px">店铺名称可修改，但底层身份固定为 store_id；旧名称自动保留为历史别名。</div></div><button class="btn blue" onclick="openStoreModal()">+ 新增店铺</button></div>
 <div class="table-wrap"><table class="table"><thead><tr><th>负责人</th><th>店铺</th><th>平台</th><th>业务模式</th><th>状态</th><th>操作</th></tr></thead><tbody id="storeRows"></tbody></table></div>
</section>

<section id="viewStyles" class="panel hidden">
 <div class="head"><div><b>款式库</b><div class="muted" style="margin-top:4px;font-size:13px">统一款号是公司级商品身份。相同款跨店、跨商品ID统一配到这里。</div></div><button class="btn blue" onclick="openStyleModal()">+ 新增款式</button></div>
 <div class="table-wrap"><table class="table"><thead><tr><th>统一款式编码 / 款号</th><th>已配对SPU</th><th>涉及店铺</th><th>状态</th><th>操作</th></tr></thead><tbody id="styleRows"></tbody></table></div>
</section>

<section id="viewPairing" class="panel hidden">
 <div class="head"><div><b>SPU配对</b><div class="muted" style="margin-top:4px;font-size:13px">平台商品先进入商品池，再配到公司统一款号。</div></div><div class="toolbar"><button class="btn gray" onclick="downloadTemplate()">下载导入模板</button><button class="btn gray" onclick="openImportModal()">批量导入配对</button><button class="btn blue" onclick="openProductModal()">+ 新增商品 / SPU</button></div></div>
 <div class="body" style="padding-bottom:0"><div class="filters">
   <select id="ownerFilter" class="input"><option value="">全部负责人</option></select>
   <select id="storeFilter" class="input"><option value="">全部店铺</option></select>
   <select id="pairFilter" class="input"><option value="">全部配对状态</option><option value="paired">已配对</option><option value="unpaired">未配对</option></select>
   <input id="searchBox" class="input" placeholder="搜索商品ID / SPU / 款号">
 </div>
 <div id="bulkBar" style="display:none;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #e5eaf1">
   <b>已选择 <span id="selectedCount">0</span> 条</b>
   <button class="btn blue" onclick="openBulkPairModal()">批量配对</button>
   <button class="btn red" onclick="bulkUnpair()">批量解除配对</button>
   <button class="btn gray" onclick="clearSelection()">取消选择</button>
 </div></div>
 <div class="table-wrap"><table class="table"><thead><tr><th style="width:44px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th><th>负责人</th><th>店铺</th><th>商品ID</th><th>SPU</th><th>统一款号</th><th>配对状态</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div>
</section>

<section id="viewHistory" class="panel hidden">
 <div class="head"><div><b>配对记录</b><div class="muted" style="margin-top:4px;font-size:13px">记录手动配对、更换配对和解除配对，便于追溯。</div></div></div>
 <div class="body" id="historyList"></div>
</section>
</main>
<div id="modalRoot"></div>
<script>
const U='https://iscadepgzegrvcqzosso.supabase.co';
const K='sb_publishable_9wdwV4dxsojsa89HV7fbnA_yh1MZTs2';
let session=null,data={members:[],stores:[],products:[],styles:[],history:[],counts:{}},refreshPromise=null,currentTab='stores',selectedIds=new Set();
try{session=JSON.parse(localStorage.getItem('ynerp'))}catch{}
const embedded=new URLSearchParams(location.search).get('embedded')==='1';if(embedded)backBtn.style.display='none';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){return session?.access_token||localStorage.getItem('temu_token')||''}
function refreshToken(){return session?.refresh_token||localStorage.getItem('temu_refresh_token')||''}
function persist(d){if(!d?.access_token)return;localStorage.setItem('temu_token',d.access_token);if(d.refresh_token)localStorage.setItem('temu_refresh_token',d.refresh_token);if(session){session={...session,...d,user:d.user||session.user};localStorage.setItem('ynerp',JSON.stringify(session))}}
async function refreshSession(){if(refreshPromise)return refreshPromise;const rt=refreshToken();if(!rt)throw new Error('登录已过期');refreshPromise=(async()=>{const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.error||'登录已过期');persist(d);return d.access_token})().finally(()=>refreshPromise=null);return refreshPromise}
async function call(api,opt={},retried=false){let t=token();if(!t)throw new Error('请返回P0主系统重新登录');const r=await fetch(U+'/functions/v1/ops-master-data?api='+api,{...opt,headers:{apikey:K,'Content-Type':'application/json',Authorization:'Bearer '+t,...(opt.headers||{})},cache:'no-store'});const x=await r.text();let d={};try{d=JSON.parse(x)}catch{d={error:x}}if(r.status===401&&!retried){await refreshSession();return call(api,opt,true)}if(!r.ok)throw new Error(d.error||'请求失败');return d}
function switchTab(t){currentTab=t;['stores','styles','pairing','history'].forEach(x=>{document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===t);document.getElementById('view'+x[0].toUpperCase()+x.slice(1)).classList.toggle('hidden',x!==t)})}
function memberName(id){return data.members.find(x=>x.user_id===id)?.display_name||'未绑定'}
function ownerOptions(selected){return '<option value="">请选择负责人</option>'+data.members.map(m=>'<option value="'+e(m.user_id)+'" '+(m.user_id===selected?'selected':'')+'>'+e(m.display_name)+'</option>').join('')}
function storeOptions(){return '<option value="">请选择店铺</option>'+data.stores.map(s=>'<option value="'+e(s.id)+'">'+e(s.store_name)+' · '+e(memberName(s.primary_user_id))+'</option>').join('')}
function activeStyleOptions(selected){return '<option value="">请选择统一款号</option>'+data.styles.filter(s=>s.is_active).map(s=>'<option value="'+e(s.id)+'" '+(s.id===selected?'selected':'')+'>'+e(s.style_code)+'</option>').join('')}
function renderCounts(){storeCount.textContent=data.counts.stores??0;styleCount.textContent=data.counts.styles??0;pairedCount.textContent=data.counts.products_paired??0;unpairedCount.textContent=data.counts.products_unpaired??0}
function renderStores(){storeRows.innerHTML=data.stores.map(s=>'<tr><td><select class="input select" id="owner_'+s.id+'">'+ownerOptions(s.primary_user_id)+'</select></td><td><b>'+e(s.store_name)+'</b></td><td>'+e(s.platform||'—')+'</td><td>'+e(s.business_model||'—')+'</td><td>'+(s.primary_user_id?'<span class="pill ok">已绑定</span>':'<span class="pill warn">未绑定</span>')+'</td><td><button class="btn blue" onclick="saveOwner(\''+s.id+'\')">保存</button></td></tr>').join('')}
function renderStyles(){styleRows.innerHTML=data.styles.length?data.styles.map(s=>'<tr><td><b>'+e(s.style_code)+'</b></td><td>'+e(s.paired_spu_count||0)+'</td><td>'+e(s.store_count||0)+'</td><td>'+(s.is_active?'<span class="pill ok">启用</span>':'<span class="pill">停用</span>')+'</td><td>'+(s.is_active?'<button class="btn gray" onclick="toggleStyle(\''+s.id+'\',false)">停用</button>':'<button class="btn green" onclick="toggleStyle(\''+s.id+'\',true)">启用</button>')+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">还没有统一款式，先新增第一条款号。</td></tr>'}
function filteredProducts(){const of=ownerFilter.value,sf=storeFilter.value,pf=pairFilter.value,q=searchBox.value.trim().toLowerCase();return data.products.filter(p=>(!of||p.primary_user_id===of)&&(!sf||p.store_id===sf)&&(!pf||(pf==='paired'?!!p.style_id:!p.style_id))&&(!q||[p.product_id,p.spu,p.style_code].some(v=>String(v||'').toLowerCase().includes(q))))}
function renderProducts(){const rows=filteredProducts();productRows.innerHTML=rows.length?rows.map(p=>'<tr><td><input type="checkbox" class="rowCheck" data-id="'+e(p.id)+'" '+(selectedIds.has(p.id)?'checked':'')+' onchange="toggleSelected(\''+p.id+'\',this.checked)"></td><td><b>'+e(p.owner_name||'未绑定')+'</b></td><td>'+e(p.store_name)+'</td><td><b>'+e(p.product_id)+'</b></td><td><div style="display:flex;gap:6px"><input class="input" id="spu_'+p.id+'" value="'+e(p.spu||'')+'" style="min-width:130px"><button class="btn gray" onclick="saveSpu(\''+p.id+'\')">保存</button></div></td><td>'+(p.style_code?'<b>'+e(p.style_code)+'</b>':'—')+'</td><td>'+(p.style_id?'<span class="pill ok">已配对</span>':'<span class="pill warn">未配对</span>')+'</td><td>'+(p.style_id?'<button class="btn gray" onclick="openPairModal(\''+p.id+'\')">更换配对</button> <button class="btn red" onclick="unpair(\''+p.id+'\')">解除配对</button>':'<button class="btn blue" onclick="openPairModal(\''+p.id+'\')">配对</button>')+'</td></tr>').join(''):'<tr><td colspan="8" class="empty">没有符合条件的商品</td></tr>';syncBulkBar()}
function toggleSelected(id,checked){if(checked)selectedIds.add(id);else selectedIds.delete(id);syncBulkBar()}
function toggleSelectAll(checked){filteredProducts().forEach(p=>checked?selectedIds.add(p.id):selectedIds.delete(p.id));renderProducts()}
function clearSelection(){selectedIds.clear();const a=document.getElementById('selectAll');if(a)a.checked=false;renderProducts()}
function syncBulkBar(){selectedCount.textContent=selectedIds.size;bulkBar.style.display=selectedIds.size?'flex':'none';const rows=filteredProducts();const a=document.getElementById('selectAll');if(a)a.checked=rows.length>0&&rows.every(p=>selectedIds.has(p.id))}
function renderHistory(){historyList.innerHTML=data.history.length?data.history.map(h=>{const act=h.action==='PAIR'?'配对':h.action==='REPAIR'?'更换配对':'解除配对';const change=(h.old_style_code||'未配对')+' → '+(h.new_style_code||'未配对');return '<div class="history-item"><div class="history-title">'+e(h.store_name)+' · '+e(h.product_id)+' · '+e(h.spu||'—')+' · '+e(act)+'</div><div class="history-sub">'+e(change)+' · '+new Date(h.created_at).toLocaleString('zh-CN')+(h.operator_name?' · '+e(h.operator_name):'')+' · '+e(h.source||'MANUAL')+'</div></div>'}).join(''):'<div class="empty">暂无配对记录</div>'}
function fillFilters(){ownerFilter.innerHTML='<option value="">全部负责人</option>'+data.members.map(m=>'<option value="'+e(m.user_id)+'">'+e(m.display_name)+'</option>').join('');storeFilter.innerHTML='<option value="">全部店铺</option>'+data.stores.map(s=>'<option value="'+e(s.id)+'">'+e(s.store_name)+'</option>').join('')}
async function load(){refreshBtn.disabled=true;try{data=await call('list');renderCounts();fillFilters();renderStores();renderStyles();renderProducts();renderHistory();msg.innerHTML=''}catch(z){msg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}finally{refreshBtn.disabled=false}}
function closeModal(){modalRoot.innerHTML=''}
function openStoreModal(){modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>新增店铺</h2><button class="modal-close" onclick="closeModal()">×</button></div><form id="storeForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>店铺名称 *</label><input class="input" name="store_name" required></div><div class="field"><label>负责人 *</label><select class="input" name="primary_user_id" required>'+ownerOptions('')+'</select></div><div class="field"><label>平台</label><select class="input" name="platform"><option>TEMU</option><option>SHEIN</option><option>TikTok Shop</option></select></div><div class="field"><label>业务模式</label><select class="input" name="business_model"><option value="">未设置</option><option>半托管</option><option>全托管</option></select></div><div id="storeFormMsg" class="wide"></div></div></div><div class="modal-actions"><button type="button" class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" type="submit">创建</button></div></form></div></div>';storeForm.onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await call('create-store',{method:'POST',body:JSON.stringify({store_name:f.store_name.value.trim(),primary_user_id:f.primary_user_id.value,platform:f.platform.value,business_model:f.business_model.value})});closeModal();await load()}catch(z){storeFormMsg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}}
function openStyleModal(){modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal" style="width:min(520px,96vw)"><div class="modal-head"><h2>新增统一款式</h2><button class="modal-close" onclick="closeModal()">×</button></div><form id="styleForm"><div class="modal-body"><div class="field"><label>统一款式编码 / 款号 *</label><input class="input" name="style_code" required placeholder="例如 YN-CARGO-001"></div><div class="muted" style="font-size:13px;margin-top:10px">同一款跨店、跨商品ID都配到同一个款号。</div><div id="styleFormMsg"></div></div><div class="modal-actions"><button type="button" class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" type="submit">新增款式</button></div></form></div></div>';styleForm.onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await call('create-style',{method:'POST',body:JSON.stringify({style_code:f.style_code.value.trim()})});closeModal();await load();switchTab('styles')}catch(z){styleFormMsg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}}
function openProductModal(){modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>新增平台商品 / SPU</h2><button class="modal-close" onclick="closeModal()">×</button></div><form id="productForm"><div class="modal-body"><div class="form-grid"><div class="field"><label>店铺 *</label><select class="input" name="store_id" required>'+storeOptions()+'</select></div><div class="field"><label>商品ID *</label><input class="input" name="product_id" required></div><div class="field"><label>SPU *</label><input class="input" name="spu" required></div><div class="field"><label>站点</label><input class="input" name="site" value="US"></div><div class="field"><label>币种</label><select class="input" name="currency"><option>USD</option><option>CNY</option></select></div><div class="wide muted" style="font-size:13px">新增后默认“未配对”，再在 SPU 配对页选择公司统一款号。</div><div id="productFormMsg" class="wide"></div></div></div><div class="modal-actions"><button type="button" class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" type="submit">新增商品 / SPU</button></div></form></div></div>';productForm.onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await call('create-product',{method:'POST',body:JSON.stringify({store_id:f.store_id.value,product_id:f.product_id.value.trim(),spu:f.spu.value.trim(),site:f.site.value.trim()||'US',currency:f.currency.value})});closeModal();await load();switchTab('pairing')}catch(z){productFormMsg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}}
function openPairModal(productId){const p=data.products.find(x=>x.id===productId);if(!p)return;modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal" style="width:min(560px,96vw)"><div class="modal-head"><h2>'+(p.style_id?'更换配对':'配对SPU')+'</h2><button class="modal-close" onclick="closeModal()">×</button></div><form id="pairForm"><div class="modal-body"><div><b>'+e(p.store_name)+' · '+e(p.product_id)+'</b></div><div class="muted" style="margin-top:4px">SPU：'+e(p.spu||'—')+'</div><div class="field" style="margin-top:16px"><label>统一款式编码 / 款号 *</label><select class="input" name="style_id" required>'+activeStyleOptions(p.style_id)+'</select></div><div id="pairFormMsg"></div></div><div class="modal-actions"><button type="button" class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" type="submit">确认'+(p.style_id?'更换':'配对')+'</button></div></form></div></div>';pairForm.onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await call('pair-product',{method:'POST',body:JSON.stringify({product_ref_id:p.id,style_id:f.style_id.value,source:'MANUAL'})});closeModal();await load()}catch(z){pairFormMsg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}}
function openBulkPairModal(){if(!selectedIds.size)return;modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal" style="width:min(560px,96vw)"><div class="modal-head"><h2>批量配对</h2><button class="modal-close" onclick="closeModal()">×</button></div><form id="bulkPairForm"><div class="modal-body"><div class="muted">将选中的 <b>'+selectedIds.size+'</b> 条商品统一配到同一个款号。</div><div class="field" style="margin-top:16px"><label>统一款号 *</label><select class="input" name="style_id" required>'+activeStyleOptions('')+'</select></div><div id="bulkPairMsg"></div></div><div class="modal-actions"><button type="button" class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" type="submit">确认批量配对</button></div></form></div></div>';bulkPairForm.onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{const d=await call('bulk-pair',{method:'POST',body:JSON.stringify({product_ref_ids:[...selectedIds],style_id:f.style_id.value})});closeModal();selectedIds.clear();await load();switchTab('pairing');msg.innerHTML='<div class="msg" style="background:#ecfdf5;color:#166534">批量配对完成：成功 '+d.processed+'，未变化 '+d.unchanged+'，失败 '+(d.errors||[]).length+'。</div>'}catch(z){bulkPairMsg.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}}
async function bulkUnpair(){if(!selectedIds.size)return;if(!confirm('确认批量解除选中 '+selectedIds.size+' 条商品的配对？'))return;try{const d=await call('bulk-unpair',{method:'POST',body:JSON.stringify({product_ref_ids:[...selectedIds]})});selectedIds.clear();await load();switchTab('pairing');msg.innerHTML='<div class="msg" style="background:#ecfdf5;color:#166534">批量解除完成：成功 '+d.processed+'，未变化 '+d.unchanged+'，失败 '+(d.errors||[]).length+'。</div>'}catch(z){alert(z.message)}}
function downloadTemplate(){const csv='店铺,商品ID,SPU,统一款号\n8号,606297378402192,8430955764,YN-CARGO-001\n';const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SPU配对导入模板.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function openImportModal(){modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>批量导入配对</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="muted" style="line-height:1.7">请上传 CSV 文件，表头固定为：<b>店铺, 商品ID, SPU, 统一款号</b>。统一款号必须已存在于款式库。</div><input type="file" id="importFile" accept=".csv,text/csv" class="input" style="margin-top:14px"><div id="importPreview" style="margin-top:14px"></div></div><div class="modal-actions"><button class="btn gray" onclick="closeModal()">取消</button><button class="btn blue" id="importBtn" onclick="runImport()" disabled>开始导入</button></div></div></div>';importFile.onchange=previewImport}
let importRows=[];
async function previewImport(){importRows=[];const f=importFile.files?.[0];if(!f){importBtn.disabled=true;return}const text=await f.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2){importPreview.innerHTML='<div class="msg">文件没有数据行。</div>';importBtn.disabled=true;return}const header=parseCsvLine(lines[0]);const expected=['店铺','商品ID','SPU','统一款号'];if(expected.some((x,i)=>header[i]!==x)){importPreview.innerHTML='<div class="msg">表头不正确，请使用系统模板。</div>';importBtn.disabled=true;return}importRows=lines.slice(1).map(line=>{const x=parseCsvLine(line);return{store_name:x[0]||'',product_id:x[1]||'',spu:x[2]||'',style_code:x[3]||''}});importPreview.innerHTML='<div class="msg" style="background:#eff6ff;color:#1d4ed8">已读取 '+importRows.length+' 行。导入时会逐行校验店铺、商品ID、SPU和款号。</div>';importBtn.disabled=!importRows.length}
async function runImport(){if(!importRows.length)return;importBtn.disabled=true;importBtn.textContent='正在导入...';try{const d=await call('import-pairing',{method:'POST',body:JSON.stringify({rows:importRows})});closeModal();await load();switchTab('pairing');const errs=(d.errors||[]).slice(0,5).map(x=>'第'+x.row+'行：'+x.error).join('；');msg.innerHTML='<div class="msg" style="background:#ecfdf5;color:#166534">导入完成：成功 '+d.success+'，未变化 '+d.unchanged+'，失败 '+d.failed+'。'+(errs?' '+e(errs):'')+'</div>'}catch(z){importBtn.disabled=false;importBtn.textContent='开始导入';importPreview.innerHTML='<div class="msg">'+e(z.message)+'</div>'}}
async function saveOwner(id){const v=document.getElementById('owner_'+id).value;if(!v){alert('请选择负责人');return}try{await call('save-store-owner',{method:'POST',body:JSON.stringify({store_id:id,primary_user_id:v})});await load()}catch(z){alert(z.message)}}
async function saveSpu(id){const spu=document.getElementById('spu_'+id).value.trim();if(!spu){alert('SPU不能为空');return}try{await call('update-spu',{method:'POST',body:JSON.stringify({product_ref_id:id,spu})});await load()}catch(z){alert(z.message)}}
async function toggleStyle(id,isActive){try{await call('set-style-active',{method:'POST',body:JSON.stringify({style_id:id,is_active:isActive})});await load()}catch(z){alert(z.message==='STYLE_IN_USE'?'该款式仍有已配对SPU，先解除这些配对后才能停用。':z.message)}}
async function unpair(id){if(!confirm('确认解除这个SPU与统一款号的配对？'))return;try{await call('unpair-product',{method:'POST',body:JSON.stringify({product_ref_id:id})});await load()}catch(z){alert(z.message)}}
[ownerFilter,storeFilter,pairFilter].forEach(x=>x.onchange=renderProducts);searchBox.oninput=renderProducts;refreshBtn.onclick=load;load();
</script>
</body></html>
